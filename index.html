<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden Weeding Helper</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="garden-grid" id="gardenGrid">
        <!-- Grid items will be generated by script.js -->
    </div>

    <div class="modal" id="plantModal">
        <button class="close-button" id="closeModal">&times;</button>
        <div class="modal-content" id="modalContent">
            <h1 id="modalTitle">Plant Name</h1>
            <p id="modalHeight">Mature Height: 0 ft</p>
            <div class="modal-images" id="modalImages">
                <!-- Images will be injected here -->
            </div>
        </div>
    </div>

    <div id="rotationAlert" class="rotation-alert">Rotated the Grid!</div>

    <script src="script.js"></script>
</body>

</html>
